<!doctype html>
<html lang="sv">
  <head><meta charset="utf-8" /><title>Bordsbokning – registrering</title></head>
  <body>
    <form name="bordsbokning" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="bordsbokning" />
      <input name="namn" />
      <input name="telefon" type="tel" />
      <input name="email" type="email" />
      <input name="datum" type="date" />
      <input name="tid" />
      <input name="antal" />
      <textarea name="meddelande"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
